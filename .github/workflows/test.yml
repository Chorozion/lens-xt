name: Tests

# Runs the test suite on every push to main + every PR.
# Catches regressions before a tag-driven publish ever fires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install everything except torch (cassandra backend integration test
          # is gated on local weights so it skips here)
          python -m pip install -e ".[dev,openai,server]"

      - name: Run tests
        run: |
          python -m pytest tests/ -q --ignore=tests/test_local_mdlm.py -m "not live"

      - name: Type-check (informational only)
        run: |
          python -m pip install mypy
          mypy lensx/ --ignore-missing-imports || true
